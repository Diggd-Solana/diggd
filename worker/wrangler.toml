name = "diggd-rh-api"
main = "src/index.js"
compatibility_date = "2026-01-01"

# Checks market caps and digs up bones.
[triggers]
crons = ["*/2 * * * *"]

# Create with `npx wrangler d1 create diggd` and paste the database_id here.
[[d1_databases]]
binding = "DB"
database_name = "diggd-rh"
database_id = "88da917c-e93d-4ac9-8be0-a66a899a9af9"

[vars]
# $DIGGD contract after launch. Empty = no burn to bury, no holders-first window.
TOKEN_ADDRESS = "0x2fe05351f36c229651ebbc7a95dddea00eb3f709"
TOKEN_DECIMALS = "18"
# $DIGGD burned to bury one bone.
BURY_BURN = "50000"
# Holders of HOLD_EARLY $DIGGD read a dug bone EARLY_MIN minutes before everyone else.
HOLD_EARLY = "500000"
EARLY_MIN = "5"
# Market cap has to hold the target for this many checks in a row (one check every 2 minutes).
CONFIRM_CHECKS = "2"
MIN_TARGET_USD = "5000"
# Public site, used in links returned by the API.
SITE_URL = "https://diggd.fun"
# Secrets (not here), set with `npx wrangler secret put <NAME>`:
#   RH_RPC_URL = your Robinhood Chain RPC url
#   SEAL_KEY   = long random string that encrypts sealed text. Losing it loses every sealed bone.
#   ADMIN_KEY  = long random string for POST /v1/admin/hide
